name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gr-notification-microservice:ci .
      - run: |
          docker run -d --name app-smoke -p 4600:4600 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e JWT_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" \
            -e INTERNAL_SERVICE_TOKEN="$(openssl rand -hex 32)" \
            gr-notification-microservice:ci
          curl --retry 15 --retry-delay 2 --retry-all-errors -fsS http://localhost:4600/health

  release:
    name: Build y desplegar
    needs: [build-and-check, docker-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: GestionResidencialPoli/gr-infra/.github/workflows/build-push.yml@main
    with:
      service-name: gr-notification-microservice
      compose-service: notification-microservice
    secrets:
      JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
      JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}
